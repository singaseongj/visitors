<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>방명록</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page-container">

    <section class="comment-section">

      <h2>방명록</h2>


      <!-- COMMENT FORM -->

      <form id="commentForm">

        <div class="form-row">

          <div class="form-group">
            <label for="commentAuthor">
              작성자
            </label>

            <input
              id="commentAuthor"
              type="text"
              maxlength="30"
              placeholder="작성자"
              required
            >
          </div>


          <div class="form-group">
            <label for="commentPassword">
              비밀번호
            </label>

            <input
              id="commentPassword"
              type="password"
              minlength="4"
              maxlength="50"
              placeholder="비밀번호"
              required
            >
          </div>

        </div>


        <div class="form-group">

          <label for="commentContent">
            내용
          </label>

          <textarea
            id="commentContent"
            maxlength="100"
            placeholder="※ 비방하는 글은 자제해주세요. 여러분들의 양심을 믿습니다. - 성쌤"
            required
          ></textarea>

        </div>


        <div class="form-footer">

          <span id="characterCount">
            0 / 100
          </span>

          <button
            id="submitButton"
            type="submit"
          >
            댓글 작성
          </button>

        </div>

      </form>


      <!-- STATUS -->

      <div
        id="statusMessage"
        class="status-message"
        aria-live="polite"
      ></div>


      <!-- COMMENT TABLE -->

      <div class="table-wrapper">

        <table class="comment-table">

          <thead>
            <tr>

              <th class="date-column">
                <button
                  id="sortByDate"
                  class="sort-button"
                  type="button"
                >
                  날짜
                  <span id="dateSortIndicator">↓</span>
                </button>
              </th>


              <th class="content-column">
                내용
              </th>


              <th class="author-column">
                작성자
              </th>


              <th class="like-column">
                <button
                  id="sortByLikes"
                  class="sort-button"
                  type="button"
                >
                  좋아요
                  <span id="likeSortIndicator"></span>
                </button>
              </th>

            </tr>
          </thead>


          <tbody id="comments">

            <tr>
              <td
                colspan="4"
                class="table-message"
              >
                댓글을 불러오는 중...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
