<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Singaseong Comments</title>

  <link rel="icon" href="src/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="src/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="src/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="src/apple-touch-icon.png">
  <link rel="manifest" href="src/site.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <a
    class="return-button"
    href="https://singaseong.uk"
    aria-label="메인 페이지로 돌아가기"
  >
    <span aria-hidden="true">←</span>
    돌아가기
  </a>

  <main class="page-container">

    <section class="comment-section">

      <h2>Comments On Singaseong</h2>


      <!-- COMMENT FORM -->

      <form id="commentForm">

        <div class="form-row">

          <div class="form-group">
            <label for="commentAuthor">
              작성자
            </label>

            <input
              id="commentAuthor"
              type="text"
              maxlength="30"
              placeholder="작성자"
              required
            >
          </div>


          <div class="form-group">
            <label for="commentPassword">
              비밀번호
            </label>

            <input
              id="commentPassword"
              type="password"
              minlength="4"
              maxlength="64"
              placeholder="비밀번호"
              autocomplete="new-password"
              required
            >
          </div>

        </div>

        <div class="form-group">

          <label for="commentContent">
            내용
          </label>

          <textarea
            id="commentContent"
            maxlength="100"
            placeholder="※ 비방하는 글은 자제해주세요. 여러분들의 양심을 믿습니다. - 성쌤"
            required
          ></textarea>

        </div>


        <div class="form-footer">

          <span id="characterCount">
            0 / 100
          </span>

          <button
            id="submitButton"
            type="submit"
          >
            댓글 작성
          </button>

        </div>

      </form>


      <!-- STATUS -->

      <div
        id="statusMessage"
        class="status-message"
        aria-live="polite"
      ></div>


      <!-- COMMENT TABLE -->

      <div class="table-wrapper">

        <table class="comment-table">

          <thead>
            <tr>

              <th class="date-column">
                <button
                  id="sortByDate"
                  class="sort-button"
                  type="button"
                >
                  날짜
                  <span id="dateSortIndicator">↓</span>
                </button>
              </th>


              <th class="content-column">
                내용
              </th>


              <th class="author-column">
                작성자
              </th>


              <th class="like-column">
                <button
                  id="sortByLikes"
                  class="sort-button"
                  type="button"
                >
                  좋아요
                  <span id="likeSortIndicator"></span>
                </button>
              </th>

            </tr>
          </thead>


          <tbody id="comments">

            <tr>
              <td
                colspan="4"
                class="table-message"
              >
                댓글을 불러오는 중...
              </td>
            </tr>

          </tbody>

        </table>

      </div>

    </section>

  </main>

  <footer class="page-footer">
    <a href="privacy.html">개인정보처리방침</a>
  </footer>

  <footer class="page__footer" aria-label="방문자 수">
    <div id="visit-counter" class="visit-counter" aria-live="polite">
      <span class="visit-counter__icon" aria-hidden="true">◉</span>
      <span class="visit-counter__text">방문자 수를 불러오는 중입니다.</span>
    </div>
  </footer>

  <script src="script.js"></script>

  <script>
    fetch("https://script.google.com/macros/s/AKfycbxIux44vWMhebIOrX5m2yd8-CZ0vGv8wi3SDBEKFn-StfcjKLmUOXqcTEX6tmRZ-rs7sg/exec")
      .then((res) => res.text())
      .then((text) => {
        const counter = document.getElementById("visit-counter");
        if (!counter) {
          return;
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch {
          console.warn("Visit counter response is not JSON:", text);
          counter.querySelector(".visit-counter__text").innerText =
            "방문자 수를 불러오지 못했습니다.";
          return;
        }

        const daily = data?.daily ?? "-";
        const total = data?.total ?? "-";
        counter.querySelector(".visit-counter__text").innerText =
          `today ${daily} ｜ total ${total} since 2026.8.14.`;
      })
      .catch((error) => {
        console.error("Visit counter fetch failed:", error);
        const counter = document.getElementById("visit-counter");
        if (counter) {
          counter.querySelector(".visit-counter__text").innerText =
            "방문자 수를 불러오지 못했습니다.";
        }
      });
  </script>

</body>
</html>
